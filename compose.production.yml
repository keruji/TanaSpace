services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tanaspace}
      POSTGRES_USER: ${POSTGRES_USER:-tanaspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the application image reference}
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set your public domain}
      DJANGO_TRUST_PROXY_SSL_HEADER: "true"
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-tanaspace}
      POSTGRES_USER: ${POSTGRES_USER:-tanaspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEMO_ACCOUNT_TTL_SECONDS: ${DEMO_ACCOUNT_TTL_SECONDS:-3600}
      DEMO_MAX_ACTIVE_USERS: ${DEMO_MAX_ACTIVE_USERS:-25}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command: sh scripts/start-production.sh
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    ports:
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR}:/etc/nginx/certs:ro
      - staticfiles:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  staticfiles:
