name: Test production server access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  connection:
    name: Verify SSH and Docker access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Connect to VPS and inspect deployment
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_PORT:?Missing SSH_PORT}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/tanaspace-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          printf -v remote_command 'bash -s -- %q' "$DEPLOY_PATH"

          ssh \
            -i "$ssh_dir/key" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" <<'REMOTE'
          set -euo pipefail

          deploy_path=$1

          echo "Connected as:"
          whoami

          echo "Docker version:"
          docker --version

          echo "Docker Compose version:"
          docker compose version

          cd -- "$deploy_path"
          test -f compose.production.yml
          test -f .env.production

          echo "Deployment directory and required files exist."

          echo "Production containers:"
          docker ps \
            --filter label=com.docker.compose.project=tanaspace_prod \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

          echo "Server access checks passed."
          REMOTE