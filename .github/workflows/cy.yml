name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Django tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      python_test_exit_code: ${{ steps.python-tests.outputs.exit_code || steps.helper-tests.outputs.exit_code }}
      python_tests_failed: >-
        ${{ (steps.python-tests.outcome == 'failure' && steps.python-tests.outputs.exit_code == '1') ||
            (steps.helper-tests.outcome == 'failure' && steps.helper-tests.outputs.exit_code == '1') }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tanaspace_ci
          POSTGRES_USER: tanaspace_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tanaspace_ci -d tanaspace_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tanaspace_ci
      POSTGRES_USER: tanaspace_ci
      POSTGRES_PASSWORD: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check deployment script syntax
        run: |
          bash -n scripts/check-release.sh
          bash -n scripts/deploy-release.sh
          bash -n scripts/preview-recovery.sh
          bash -n scripts/rehearse-recovery.sh
          bash -n scripts/inspect-production.sh
          sh -n scripts/start-production.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Test deployment and recovery helpers
        id: helper-tests
        run: |
          status=0
          python -m unittest discover -s scripts -p 'test_*.py' -v || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to temporary database
        run: python manage.py migrate --noinput

      - name: Run Python tests
        id: python-tests
        run: |
          status=0
          python manage.py test --noinput --verbosity 2 || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

  publish:
    name: Publish application image
    needs: checks
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'TanaSpace-Recovery: revert')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image: ${{ steps.release.outputs.image }}

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/keruji/tanaspace

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published release
        id: release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          {
            echo "## Published application image"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Image tag: $IMAGE_NAME:$GITHUB_SHA"
            echo ""
            echo "Exact image: $IMAGE_NAME@$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production
    needs: publish
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'TanaSpace-Recovery: revert')
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.publish.outputs.image }}
    secrets: inherit

  recover-tests:
    name: Recover failed merged tests
    needs: checks
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && needs.checks.result == 'failure' &&
          needs.checks.outputs.python_tests_failed == 'true' &&
          !contains(github.event.head_commit.message, 'TanaSpace-Recovery: revert') }}
    uses: ./.github/workflows/recover-tests.yml
    with:
      test_exit_code: ${{ needs.checks.outputs.python_test_exit_code }}
    secrets: inherit
