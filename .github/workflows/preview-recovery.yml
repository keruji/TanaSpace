name: Preview repository recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  preview:
    name: Preview revert and replacement
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Create temporary App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RECOVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECOVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preview recovery for current main
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/preview-recovery.sh "$GITHUB_SHA"