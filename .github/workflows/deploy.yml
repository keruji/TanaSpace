name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full image reference: ghcr.io/keruji/tanaspace@sha256:..."
        required: true
        type: string
      test_rollback:
        description: "Deliberately fail after verification to test rollback"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      image:
        description: "Application image pinned by digest"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check that this release is still current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_sha=$(
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])'
          )

          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "STOP: main has advanced beyond this release."
            echo "Run deployment for the newest commit instead."
            exit 1
          fi

      - name: Transfer release files and deploy
        id: deployment
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TEST_ROLLBACK: ${{ inputs.test_rollback || false }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_PORT:?Missing SSH_PORT}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${PRODUCTION_URL:?Missing PRODUCTION_URL}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          if [[ ! "$CANDIDATE_IMAGE" =~ ^ghcr\.io/keruji/tanaspace@sha256:[a-f0-9]{64}$ ]]; then
            echo "Provide a complete image reference pinned by digest."
            exit 1
          fi

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/tanaspace-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh_options=(
            -i "$ssh_dir/key"
            -p "$SSH_PORT"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          target="$SSH_USER@$SSH_HOST"

          remote_dir=$(ssh "${ssh_options[@]}" "$target" '
            set -eu
            umask 077
            mkdir -p /home/keruji/.local/state/tanaspace/releases
            mktemp -d /home/keruji/.local/state/tanaspace/releases/run.XXXXXX
          ')

          printf -v extract_command 'tar -xzf - -C %q' "$remote_dir"

          tar -czf - \
            compose.production.yml \
            deploy/nginx.conf \
            scripts/check-release.sh \
            scripts/deploy-release.sh \
            | ssh "${ssh_options[@]}" "$target" "$extract_command"

          printf -v deploy_command 'bash -s -- %q %q %q %q %q %q' \
            "$remote_dir" \
            "$DEPLOY_PATH" \
            "$CANDIDATE_IMAGE" \
            "$GITHUB_SHA" \
            "$PRODUCTION_URL" \
            "$TEST_ROLLBACK"

          deployment_status=0
          ssh "${ssh_options[@]}" "$target" "$deploy_command" <<'REMOTE' || deployment_status=$?
          set -euo pipefail

          release_dir=$1
          export DEPLOY_PATH=$2
          candidate_image=$3
          expected_commit=$4
          export PRODUCTION_URL=$5
          export TEST_ROLLBACK=$6

          bash "$release_dir/scripts/deploy-release.sh" \
            "$candidate_image" "$expected_commit"
          REMOTE

          report_file="$RUNNER_TEMP/deployment-result.json"
          printf -v report_command 'cat -- %q' "$remote_dir/deployment-result.json"

          if ! ssh "${ssh_options[@]}" "$target" "$report_command" > "$report_file"; then
            echo "Deployment report could not be retrieved. Repository recovery is disabled."
            echo "report_valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! python3 scripts/read-deployment-result.py \
            "$report_file" "$GITHUB_SHA" "$CANDIDATE_IMAGE" \
            "$TEST_ROLLBACK" "$deployment_status"; then
            echo "Repository recovery is disabled because the report is invalid."
            echo "report_valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          exit "$deployment_status"

      - name: Save deployment report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create repository recovery token
        id: recovery-token
        if: >-
          ${{ failure() && !cancelled() && github.event_name == 'push' &&
              vars.ENABLE_REPOSITORY_RECOVERY == 'true' &&
              steps.deployment.outputs.report_valid == 'true' &&
              steps.deployment.outputs.outcome == 'rolled_back' &&
              steps.deployment.outputs.rollback_test == 'false' &&
              steps.deployment.outputs.previous_commit != '' &&
              !contains(github.event.head_commit.message, 'TanaSpace-Recovery: revert') }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RECOVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECOVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check out history for repository recovery
        id: recovery-checkout
        if: >-
          ${{ failure() && !cancelled() && steps.recovery-token.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.recovery-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Revert failed change and open replacement PR
        if: >-
          ${{ failure() && !cancelled() && steps.recovery-checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.recovery-token.outputs.token }}
          CANDIDATE_IMAGE: ${{ inputs.image }}
          DEPLOYMENT_EXIT_CODE: ${{ steps.deployment.outputs.exit_code }}
          FAILURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/recover-repository.py "$RUNNER_TEMP/deployment-result.json"

      - name: Record deployment summary
        env:
          IMAGE: ${{ inputs.image }}
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          {
            echo "## Production deployment succeeded"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Image: $IMAGE"
            echo ""
            echo "Website: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"