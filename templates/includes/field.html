{% if field.is_hidden %}{{ field }}{% else %}
<div class="form-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <svg class="required-marker" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M2 3l8 6M2 9l8-6" stroke="currentColor" fill="none"/></svg>{% endif %}</label>
  {{ field }}
  {% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
  {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endif %}
