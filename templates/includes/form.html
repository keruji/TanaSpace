{% if form.non_field_errors %}
<div class="form-errors" role="alert">
  {{ form.non_field_errors }}
</div>
{% endif %}

{% for field in form %}
<div class="form-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
  <div class="field-errors" id="{{ field.auto_id }}_error" role="alert">
    {{ field.errors }}
  </div>
  {% endif %}
  {% if field.help_text %}
  <div class="help-text" id="{{ field.auto_id }}_helptext">
    {{ field.help_text|safe }}
  </div>
  {% endif %}
</div>
{% endfor %}
