<button data-theme-toggle type="button" class="theme-toggle" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode">
  {% if not sidebar_theme %}<span class="theme-icon theme-icon-moon">{% include 'includes/icon.html' with icon_name='moon' only %}</span>{% endif %}
  <span class="theme-icon theme-icon-sun">{% include 'includes/icon.html' with icon_name='sun' only %}</span>
  {% if sidebar_theme %}<span class="theme-icon theme-icon-moon">{% include 'includes/icon.html' with icon_name='moon' only %}</span>{% endif %}
</button>
