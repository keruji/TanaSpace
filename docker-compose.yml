services:
  app:
    build:
      context: .
    ports:
      - "5173:8000"
    volumes:
      - .:/app
      - frontend_assets:/app/dist
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-tanaspace-local-development-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-tanaspace}
      POSTGRES_USER: ${POSTGRES_USER:-tanaspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEMO_ACCOUNT_TTL_SECONDS: ${DEMO_ACCOUNT_TTL_SECONDS:-3600}
      DEMO_MAX_ACTIVE_USERS: ${DEMO_MAX_ACTIVE_USERS:-25}
    depends_on:
      frontend:
        condition: service_healthy
      db:
        condition: service_healthy
    command: sh scripts/start.sh

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tanaspace}
      POSTGRES_USER: ${POSTGRES_USER:-tanaspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - frontend_assets:/app/dist
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "test -s dist/app.css && test -s dist/app.js"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  node_modules:
  frontend_assets:
  postgres_data:
