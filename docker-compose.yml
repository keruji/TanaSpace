services:
  app:
    build:
      context: .
    ports:
      - "5173:8000"
    volumes:
      - .:/app
      - frontend_assets:/app/dist
      - database:/data
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-tanaspace-local-development-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_DB_PATH: /data/db.sqlite3
    depends_on:
      frontend:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - frontend_assets:/app/dist
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "test -s dist/app.css && test -s dist/app.js"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  node_modules:
  frontend_assets:
  database:
