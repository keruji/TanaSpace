map $request_method $write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;
limit_req_zone $write_key zone=writes:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=demo:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_zone $server_name zone=site:1m;

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 20s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=general burst=15 nodelay;
    limit_req zone=writes burst=5 nodelay;
    limit_conn perip 10;
    limit_conn site 100;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location /static/ {
        alias /srv/static/;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /accounts/demo/ {
        limit_req zone=general burst=15 nodelay;
        limit_req zone=writes burst=5 nodelay;
        limit_req zone=demo burst=1 nodelay;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
    }
}
